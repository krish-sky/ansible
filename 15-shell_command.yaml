- name: ansible command vs shell command  
  hosts: local
  connection: local
  tasks: 
  - name: command madual test
    #ansible.builtin.debug: cat /etc/passwd | grep root
    ansible.builtin.shell: cat /etc/passwd | grep root
    register: users_output

  - name: print output 
    ansible.builtin.debug:
      msg: "{{ users_output }}"

  - name: command module test
    ansible.builtin.shell: ls -ltr > files.txt
    register: files_oupt

    - name: print output 
    ansible.builtin.debug:
      msg: "{{ files_oupt }}"
