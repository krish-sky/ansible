- name: test 31
  hosts: all
  become: yes
  tasks: 
    - name: installing start nginx 
      block: 
        - name: install nginx 
          ansible.builtin.package:
            name: nginx
            state: present
          
        - name: start nginx
          ansible.builtin.service:
            name: nginx
            state: started
      
      when: "'web' in group_names and env == 'dev'"

    - name: installing mysql
      block:
        - name: installing mysql
          ansible.builtin.package:
            name: mysql 
            state: present
      
      when: "'db' in group_names and env == 'prod'"
      