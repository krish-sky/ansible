- name: Installing package
  hosts: localhost
  connection: local
  vars:
    app_name: nginx
  tasks: 
    - name: Printing package name
      ansible.builtin.debug:
        msg: "Installing {{ app_name }}"
    
    - name: Printing task level variable
      vars:
        app_name: httpd
      ansible.builtin.debug:
        msg: "Installing {{ app_name }}"