- name: gathering facts
  hosts: local
  connection: local
  tasks:
  - name: print facts
    ansible.builtin.debug:
      msg: "{{ ansible_facts }}"
  
  - name: check redhat or not
    ansible.builtin.debug:
      msg: "Yes its redhat"
    when: ansible_facts.os_family == "Redhat" 
    
  - name: check its debian or not
    ansible.builtin.debug:
      msg: "Yes, its debian"
    when: ansible_facts.os_family == "Debian"
    
