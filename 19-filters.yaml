- name: demo on filter
  hosts: local
  connection: local
  vars: 
    topics: linux, shell, ansible, terraform
    
    tagsmaps: 
      name: ansible
      project: roboshop
      component: catalogue

    tagslist: [

      {
            "key": "name",
            "value": "ansible"
        },
        {
            "key": "project",
            "value": "roboshop"
        },
        {
            "key": "component",
            "value": "catalogue"
        }

    ]


  tasks:
  - name: greeting
    ansible.builtin.debug:
      msg: "Hi krish, {{ GREETING | default('Good morning') }}"

  - name: convert list in string
    ansible.builtin.debug:
      msg: "{{ topics | split (',') }}"
  
  - name: convert map to list
    ansible.builtin.debug:
      msg: "{{ tagsmaps | dict2items }}"

  - name: convert list to map
    ansible.builtin.debug:
      msg: "{{ tagslist | items2dict }}"

  - name: read students yaml
    ansible.builtin.set_facts: # setting the variable
      students.yaml: "{{ lookup('file', students.yaml ) | from_yaml }}"