- name: demo on filter
  hosts: local
  connection: local
  vars: 
    topics: linux, shell, ansible, terraform
    tags: 
      name: ansible
      project: roboshop
      component: catalogue

  tasks:
  - name: greeting
    ansible.builti n.debug:
      msg: "Hi krish, {{ GREETING | default('Good morning') }}"

  - name: convert list in string
    ansible.builtin.debug:
      msg: "{{ topics | split (',') }}"
  
  - name: convert map to list
    ansible.builtin.debug:
      msg: "{{ tags | dict2item }}"