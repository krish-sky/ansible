- name: variable preference
  hosts: local
  connection: local
  vars:
    NAME: "Ansible from Play"
  vars_files:
  - course.yaml
  vars_Prompt: 
  - name: "Please enter your name"
    private: false
  tasks:
  - name: print name
    vars:
      NAME: "Ansible from TASK"
      ansible.builtin.debug:
        msg: "Hi {{ NAME }}"