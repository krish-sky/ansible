- name: test facts 8
  hosts: localhost
  connection: local
  vars:
    myos: "RedHat"
  
  tasks:
    - name: Name of the host
      ansible.builtin.debug:
        msg: "{{ ansible_hostname }}"

    - name: Redhat OS
      ansible.builtin.debug:
        msg: "This is RedHat system"
      
      when: ansible_distribution == myos

    - name: Not Redhat
      ansible.builtin.debug:
        msg: "This is NOT RedHat system"

      when: ansible_distribution != myos

