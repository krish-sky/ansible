- name: test facts 7
  hosts: localhost
  connection: local
  vars:
    myos: "RedHat"
  
  tasks:
    - name: Name of the host
      ansible.builtin.debug:
        msg: "ansible_distribution"

    - name: checking OS
      ansible.builtin.debug:
        msg: "This is my target OS"
      
      when: ansible_distribution == myos